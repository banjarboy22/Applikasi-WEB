name: Build APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Ekstrak File ZIP
      run: unzip IDNKaltimAppV4pro.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Buat Gradle Wrapper dan Build APK
      run: |
        WORK_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
        cd "$WORK_DIR"
        gradle wrapper
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK Hasil Build
      uses: actions/upload-artifact@v4
      with:
        name: APK-Siap-Instal
        path: "**/build/outputs/apk/debug/**/*.apk"
