name: Build APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Ekstrak File ZIP
      run: unzip IDNKaltimAppV4pro.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK Langsung
      run: |
        # Mencari letak folder utama yang memiliki file build.gradle di root (bukan di dalam app)
        # Atau masuk ke folder hasil ekstrak ZIP secara otomatis
        
        # Unduh dan pasang Gradle 8.0
        curl -L https://services.gradle.org/distributions/gradle-8.0-bin.zip -o gradle-8.0.zip
        unzip -q gradle-8.0.zip
        export PATH=$PWD/gradle-8.0/bin:$PATH
        
        # Cari direktori root proyek yang berisi file build.gradle utama
        PROJECT_DIR=$(dirname $(find . -name "settings.gradle" | head -n 1))
        cd "$PROJECT_DIR"
        
        # Jalankan wrapper dan build
        gradle wrapper --gradle-version 8.0
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK Hasil Build
      uses: actions/upload-artifact@v4
      with:
        name: APK-Siap-Instal
        path: "**/build/outputs/apk/debug/**/*.apk"
