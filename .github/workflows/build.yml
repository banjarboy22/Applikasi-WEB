name: Build APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Ekstrak File ZIP
      run: unzip IDNKaltimAppV4pro.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK Langsung
      run: |
        WORK_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
        cd "$WORK_DIR"
        
        # Mengunduh dan memasang Gradle 8.0 secara manual agar tidak pakai versi 9 yang error
        curl -L https://services.gradle.org/distributions/gradle-8.0-bin.zip -o gradle-8.0.zip
        unzip -q gradle-8.0.zip
        export PATH=$PWD/gradle-8.0/bin:$PATH
        
        # Inisialisasi wrapper dan build
        gradle wrapper --gradle-version 8.0
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK Hasil Build
      uses: actions/upload-artifact@v4
      with:
        name: APK-Siap-Instal
        path: "**/build/outputs/apk/debug/**/*.apk"
