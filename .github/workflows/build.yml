name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Ekstrak, Perbaiki Kode, dan Build APK
      run: |
        # 1. Ekstrak file ZIP proyek jika ada
        if [ -f "IDNKaltimAppV4pro.zip" ]; then
          unzip -q IDNKaltimAppV4pro.zip
        fi
        
        # 2. Temukan lokasi folder proyek
        SETTINGS_FILE=$(find . -name "settings.gradle" | head -n 1)
        if [ -n "$SETTINGS_FILE" ]; then
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$PROJECT_DIR"
        fi
        
        # 3. Paksa tambahkan import LayoutParams yang benar langsung di server GitHub
        MAIN_FILE=$(find . -name "MainActivity.kt" | head -n 1)
        if [ -n "$MAIN_FILE" ]; then
          echo "Menyuntikkan import LayoutParams ke: $MAIN_FILE"
          # Hapus baris import layout yang keliru jika ada
          sed -i '/import android.view.ViewGroup.Layout/d' "$MAIN_FILE"
          # Tambahkan import yang valid tepat di bawah baris package
          sed -i '0,/package .*/{s//&\nimport android.view.ViewGroup.LayoutParams/}' "$MAIN_FILE"
        fi
        
        # 4. Atur properti Gradle
        echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
        echo "android.defaults.buildfeatures.buildconfig=true" >> gradle.properties
        
        # 5. Build APK
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug -Dkotlin.jvm.target.validation.mode=warning
        else
          curl -L https://services.gradle.org/distributions/gradle-8.0-bin.zip -o gradle-8.0.zip
          unzip -q gradle-8.0.zip
          export PATH=$PWD/gradle-8.0/bin:$PATH
          gradle wrapper --gradle-version 8.0
          chmod +x ./gradlew
          ./gradlew assembleDebug -Dkotlin.jvm.target.validation.mode=warning
        fi

    - name: Upload APK Hasil Build
      uses: actions/upload-artifact@v4
      with:
        name: APK-Siap-Instal
        path: "**/build/outputs/apk/debug/app-debug.apk"
        if-no-files-found: warn
